# EXAMPLE — Spark의 ~/services/my-rag/compose/ 에 두고 사용한다.
# rag-db(PostgreSQL)는 이 파일이 아니라 저장소 루트의 docker-compose.yml로 별도 관리한다.
#
# 이미지는 GitHub Container Registry(ghcr.io)에서 pull한다. GitHub Actions(ci.yml)가
# main push마다 ghcr.io/nohtaehwan/my-rag:latest 로 빌드·푸시한다. GHCR 패키지를
# public으로 설정해두면 Spark에서 별도 로그인 없이 pull 가능하다(이미지에 secret이
# baked-in되지 않으므로 public이어도 안전 — 모든 credential은 env_file로 런타임에 주입).
#
# network_mode: host를 쓰는 이유 — 이 컨테이너 안에서 DB_URL/EMBEDDING_BASE_URL/LLM_BASE_URL이
# 전부 127.0.0.1을 그대로 참조하기 때문이다(기존 JAR 배포 때 검증된 값을 그대로 재사용).
# 브리지 네트워크로 바꾸면 이 값들을 서비스명/host.docker.internal로 다시 바꿔야 한다.
services:
  my-rag-app:
    image: ghcr.io/nohtaehwan/my-rag:latest
    container_name: my-rag-app
    network_mode: host
    env_file:
      - ../config/my-rag.env
    volumes:
      # 호스트의 색인 대상 마크다운을 컨테이너의 기본 document.source-directory(data/markdown,
      # WORKDIR /app 기준 상대경로)에 그대로 마운트한다. 읽기 전용(ro) — 색인 시 앱이 이 디렉터리를
      # 쓰지 않고 읽기만 한다.
      - ../data/markdown:/app/data/markdown:ro
    restart: unless-stopped
