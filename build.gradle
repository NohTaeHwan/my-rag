plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nohtaehwan'
version = '0.0.1-SNAPSHOT'
description = 'RAG backend MVP'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 로컬 개발 전용: .env가 있으면 읽어서 test/bootRun 실행 시에만 환경변수로 주입한다.
// .env는 git에 커밋되지 않으며(gitignore), 이 로직은 패키징된 산출물(bootJar)에는 영향을 주지 않는다.
// 실제 서버 배포 환경은 이 파일이 아니라 그 환경이 직접 제공하는 환경변수를 사용해야 한다.
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    def envProps = new Properties()
    envFile.withInputStream { envProps.load(it) }
    def envMap = envProps.collectEntries { key, value -> [(key.toString()): value.toString()] }

    tasks.withType(Test).configureEach {
        environment(envMap)
    }
    tasks.named('bootRun') {
        environment(envMap)
    }
}
