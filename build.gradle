plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nohtaehwan'
version = '0.0.1-SNAPSHOT'
description = 'RAG backend MVP'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 프런트엔드 번들은 bootJar(BOOT-INF/classes/static/)와 bootRun(정적 경로 추가)에만 넣어 Spring Boot가 `/`에서 제공한다.
// processResources에는 넣지 않는다 — test·Stop Hook·CI test는 Node·dist 없이 돈다.
//   로컬: frontendBuild(npm ci && npm run build)가 소스 내용 해시를 입력으로 가져 소스 변경·삭제·되돌림 시 다시 빌드되고,
//         bootJar는 그 출력(dist 내용)을 입력으로 가져 번들이 바뀌면 UP-TO-DATE/FROM-CACHE가 되지 않는다.
//   Docker: Node 단계가 만든 dist를 `-PprebuiltFrontendDist=<경로>`로 넘겨 Java 단계에서 npm을 다시 돌리지 않는다.
def prebuiltFrontendDist = providers.gradleProperty('prebuiltFrontendDist')

def frontendBuild = tasks.register('frontendBuild', Exec) {
    group = 'build'
    description = 'frontend/에서 npm ci && npm run build로 dist를 만든다(bootJar·bootRun 전용).'
    workingDir 'frontend'
    commandLine 'sh', '-c', 'npm ci && npm run build'
    inputs.files(fileTree('frontend') {
        include 'src/**', 'index.html', 'package.json', 'package-lock.json', 'tsconfig.json', 'vite.config.ts'
    }).withPropertyName('frontendSources').withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir('frontend/dist')
}

def frontendStatic = prebuiltFrontendDist.present ? files(prebuiltFrontendDist.get()) : files(frontendBuild)

// doLast: 만든 JAR의 index.html이 참조하는 /assets/* JS·CSS가 모두 JAR에 있는지 확인한다(번들 실행·렌더링 자체는 검증하지 않음).
// UP-TO-DATE/FROM-CACHE면 건너뛰지만, 그때는 입력(번들 내용)이 이미 검증된 실행과 같다.
tasks.named('bootJar') {
    bootInf {
        into('classes/static') {
            from(frontendStatic)
        }
    }
    doLast {
        def prefix = 'BOOT-INF/classes/static/'
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip ->
            def index = zip.getEntry(prefix + 'index.html')
            if (index == null) {
                throw new GradleException('bootJar: JAR에 static/index.html이 없다')
            }
            def refs = (zip.getInputStream(index).text =~ /(?:src|href)="\/(assets\/[^"]+)"/).collect { it[1] }
            def missing = refs.findAll { zip.getEntry(prefix + it) == null }
            if (!refs.any { it.endsWith('.js') } || !refs.any { it.endsWith('.css') } || missing) {
                throw new GradleException("bootJar: index.html의 JS/CSS 참조가 JAR와 맞지 않는다 — 참조 ${refs}, 누락 ${missing}")
            }
        }
    }
}

// bootRun: frontendBuild로 최신 dist를 만든 뒤 classpath:/static/에 더해 file:dist/도 정적 경로로 쓴다(`/` → index.html).
tasks.named('bootRun') {
    dependsOn frontendBuild
    systemProperty 'spring.web.resources.static-locations', "classpath:/static/,file:${file('frontend/dist')}/"
}

// DB를 비우거나 쓰는 테스트는 tag로 분리해 기본 test에서 제외한다. 아래 isolated* task로만 실행한다.
def isolatedDbTags = ['isolated-migration', 'isolated-integration']

tasks.named('test') {
    useJUnitPlatform {
        excludeTags(*isolatedDbTags)
    }
}

/*
 * 격리 DB 전용 테스트 task. 기본 URL·.env로 fallback하지 않도록 아래 환경변수 4개가 모두 있어야 하며,
 * 하나라도 없으면 테스트 JVM을 띄우기 전에 실패한다. migration·통합 테스트는 서로 다른 변수(DB)를 쓴다.
 *   {prefix}_URL, {prefix}_NAME, {prefix}_USERNAME, {prefix}_PASSWORD
 * 자격 증명은 프로세스 명령줄·로그에 남는 시스템 프로퍼티가 아니라 test worker 환경변수
 * DB_URL/DB_APP_USERNAME/DB_APP_PASSWORD로만 넘긴다. 이 task에는 .env를 주입하지 않으며,
 * 상속된 SPRING_* 환경변수도 지워 application.yml 매핑을 덮어쓰지 못하게 한다.
 * 시스템 프로퍼티에는 비밀이 아닌 opt-in·flyway 플래그와 기대 DB 이름만 둔다.
 * 테스트 코드의 IsolatedDatabaseGuard가 실제 JDBC host·DB 이름을 다시 확인한다.
 */
def isolatedDbTaskNames = ['isolatedMigrationTest', 'isolatedIntegrationTest']

def registerIsolatedDbTest = { String taskName, String tag, String envPrefix, String optInProperty, boolean flywayEnabled ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "격리 DB(${envPrefix}_*)에서 @Tag(\"${tag}\") 테스트만 실행한다."
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags tag
        }
        outputs.upToDateWhen { false }
        shouldRunAfter tasks.named('test')

        doFirst {
            def dbEnv = ['URL', 'NAME', 'USERNAME', 'PASSWORD'].collectEntries {
                [(it): providers.environmentVariable("${envPrefix}_${it}").getOrNull()]
            }
            def missing = dbEnv.findAll { !it.value }.keySet().collect { "${envPrefix}_${it}" }
            if (missing) {
                throw new GradleException("${taskName}: 격리 DB 환경변수가 없다 — ${missing.join(', ')}")
            }
            // Spring relaxed binding은 spring.datasource.url·spring_datasource_url 같은 소문자 이름도 읽으므로 대소문자·구분자 무관하게 지운다.
            environment.keySet().removeIf { it.toUpperCase(Locale.ROOT) ==~ /SPRING[._].*/ }
            // JVM이 직접 읽는 옵션 변수로 -Dspring.datasource.url 등을 주입하지 못하게 worker 환경에서만 지운다.
            ['JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS'].each { environment.remove(it) }
            environment('DB_URL', dbEnv.URL)
            environment('DB_APP_USERNAME', dbEnv.USERNAME)
            environment('DB_APP_PASSWORD', dbEnv.PASSWORD)
            systemProperty 'spring.flyway.enabled', flywayEnabled.toString()
            systemProperty 'isolatedTest.expectedDbName', dbEnv.NAME
            systemProperty optInProperty, 'true'
        }
    }
}

registerIsolatedDbTest('isolatedMigrationTest', 'isolated-migration', 'ISOLATED_MIGRATION_DB', 'isolatedMigrationTest', false)
registerIsolatedDbTest('isolatedIntegrationTest', 'isolated-integration', 'ISOLATED_INTEGRATION_DB', 'isolatedIntegrationTest', true)

// 로컬 개발 전용: .env가 있으면 읽어서 test/bootRun 실행 시에만 환경변수로 주입한다(isolated* task 제외).
// .env는 git에 커밋되지 않으며(gitignore), 이 로직은 패키징된 산출물(bootJar)에는 영향을 주지 않는다.
// 실제 서버 배포 환경은 이 파일이 아니라 그 환경이 직접 제공하는 환경변수를 사용해야 한다.
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    def envProps = new Properties()
    envFile.withInputStream { envProps.load(it) }
    def envMap = envProps.collectEntries { key, value -> [(key.toString()): value.toString()] }

    tasks.withType(Test).matching { !(it.name in isolatedDbTaskNames) }.configureEach {
        environment(envMap)
    }
    tasks.named('bootRun') {
        environment(envMap)
    }
}

// 기본 test와 Claude Stop Hook은 실DB에 연결하지 않는다. DB 검증은 격리 전용 task에서만 수행한다.
tasks.named('test') {
    doFirst {
        environment.keySet().removeIf { it.toUpperCase(Locale.ROOT) ==~ /SPRING[._].*/ }
        ['JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS'].each { environment.remove(it) }
        systemProperty 'spring.datasource.url', 'jdbc:postgresql://127.0.0.1:1/blocked'
        systemProperty 'spring.flyway.enabled', 'false'
    }
}
