spring:
  application:
    name: rag-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/rag_db}
    username: ${DB_USERNAME:rag}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

embedding:
  base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:8000/v1}
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  dimension: ${EMBEDDING_DIMENSION:1024}
  connect-timeout: 2s
  read-timeout: 30s

document:
  source-directory: ${DOCUMENT_SOURCE_DIRECTORY:data/markdown}
  chunk:
    target-length: 1200
    overlap-length: 150
    min-length: 80

mybatis:
  configuration:
    map-underscore-to-camel-case: true

retrieval:
  top-k: ${RETRIEVAL_TOP_K:5}
