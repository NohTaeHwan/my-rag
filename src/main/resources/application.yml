spring:
  application:
    name: rag-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/rag_db}
    username: ${DB_APP_USERNAME:rag_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    # 일반 앱 기동과 Spring 테스트에서는 migration을 자동 적용하지 않는다.
    # DB 변경은 태환님 승인 후 별도 절차에서만 명시적으로 실행한다.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

embedding:
  base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:8000/v1}
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  dimension: ${EMBEDDING_DIMENSION:1024}
  connect-timeout: 2s
  read-timeout: 30s

document:
  source-directory: ${DOCUMENT_SOURCE_DIRECTORY:data/markdown}
  chunk:
    target-length: 1200
    overlap-length: 150
    min-length: 80

mybatis:
  configuration:
    map-underscore-to-camel-case: true

retrieval:
  top-k: ${RETRIEVAL_TOP_K:5}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

llm:
  base-url: ${LLM_BASE_URL:http://127.0.0.1:8002/v1}
  model: ${LLM_MODEL:local-model}
  connect-timeout: 2s
  read-timeout: 60s
  max-context-chars: ${LLM_MAX_CONTEXT_CHARS:12000}
  max-tokens: ${LLM_MAX_TOKENS:512}
  temperature: ${LLM_TEMPERATURE:0.0}
  api-key: ${LLM_API_KEY:}
