# CI(ci.yml)가 main에서 성공하면 자동으로 트리거된다. 다만 prd-spark Environment의
# Required reviewer 승인이 있어야 실제 배포 스텝이 진행되므로, "자동 트리거 + 사람 승인"
# 구조는 유지된다. 필요하면 workflow_dispatch로 수동 재실행도 가능하다.
#
# 사전 준비 (GitHub 저장소 Settings에서 사람이 직접 설정):
#   1. Settings > Environments > New environment "prd-spark" 생성, Required reviewer 지정
#   2. 위 Environment에 Secret 등록: SPARK_HOST, SPARK_USER, SPARK_SSH_KEY, SPARK_DEPLOY_PATH
#      (DB_PASSWORD, LLM_API_KEY는 이 workflow로 전달하지 않는다 — Spark의 보호된
#       EnvironmentFile에만 존재해야 한다.)
#   3. Spark의 실제 sshd는 22번이 아니라 10022번 포트를 쓴다(Tailscale SSH가 22번을 가로챔).
#   4. 이미지는 ghcr.io/nohtaehwan/my-rag에서 pull한다(ci.yml이 main push마다 push함).
#      GHCR 패키지가 public이면 Spark에서 별도 로그인 없이 pull 가능 — 이 workflow도
#      Spark에 별도 GHCR 인증을 주입하지 않는다(패키지를 public으로 설정했다는 전제).
#   5. GitHub-hosted 러너는 Spark의 Tailscale 사설 IP(100.90.113.121)에 기본적으로 접근할 수
#      없다(CGNAT 대역이라 공인 인터넷에서 라우팅 안 됨). tailscale/github-action으로 이 job이
#      도는 동안만 러너를 Tailnet에 임시로 join시킨다. Secret 등록: TAILSCALE_AUTHKEY
#      (Ephemeral 키 — job 종료/연결 해제 시 Tailnet에서 자동 삭제됨).
#   6. deploy.sh는 저장소(deploy/dgx-spark/deploy.sh)가 유일한 원본이다 — 매 배포마다 이 워크플로가
#      Spark로 scp해서 덮어쓰므로, Spark에 수동으로 다른 버전을 남겨두지 않는다.
#
# 배포 대상 SHA 고정:
#   - 자동(workflow_run): 성공한 CI의 head_sha. 같은 저장소 main으로의 push로 실행된 CI만 신뢰한다.
#   - 수동(workflow_dispatch): `sha` 입력(40자리 커밋 SHA) 필수. main 이력에 있는 커밋만 허용한다.
#   이 SHA로 checkout한 deploy.sh를 scp하고, Spark에는 ghcr.io/nohtaehwan/my-rag:<SHA> 이미지만 배포한다
#   (latest·기본 브랜치 SHA로 대체하지 않음). SHA 형식·checkout 불일치·이미지 미존재면 Spark 접속 전에 실패한다.
name: CD (DGX Spark)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '배포할 main 커밋 SHA(40자리 소문자 hex). CI가 ghcr.io/nohtaehwan/my-rag:<SHA>를 발행한 커밋이어야 한다.'
        required: true
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: prd-spark
    # 같은 prd-spark 배포를 한 번에 하나만 실행한다. 진행 중 배포(deploy.sh·롤백)는 취소하지 않는다.
    # GitHub 규칙상 그룹당 실행 1개 + 대기 1개만 유지되며, 새 run이 들어오면 기존 대기 run은 취소된다.
    concurrency:
      group: cd-prd-spark
      cancel-in-progress: false
    env:
      HEALTH_URL: http://127.0.0.1:8090/health
      IMAGE: ghcr.io/nohtaehwan/my-rag
    steps:
      # 입력값은 env로만 넘겨 셸에 직접 삽입하지 않는다.
      - name: Resolve deploy SHA
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then SHA="$INPUT_SHA"; else SHA="$RUN_SHA"; fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::배포 SHA 형식 오류 — 40자리 소문자 hex만 허용"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0

      - name: Verify checkout and image
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checkout HEAD가 배포 SHA와 다름"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::main 이력에 없는 커밋"; exit 1; }
          # SHA 고정 이전 커밋의 deploy.sh는 DEPLOY_SHA를 무시하고 latest를 배포하므로 거부한다.
          grep -q 'DEPLOY_SHA' deploy/dgx-spark/deploy.sh || { echo "::error::이 커밋의 deploy.sh는 SHA 고정을 지원하지 않음"; exit 1; }
          docker manifest inspect "$IMAGE:$SHA" > /dev/null || { echo "::error::$IMAGE:$SHA 이미지가 없음"; exit 1; }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SPARK_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -p 10022 -H "${{ secrets.SPARK_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync deploy script to Spark
        run: |
          scp -i ~/.ssh/id_deploy -P 10022 deploy/dgx-spark/deploy.sh \
            "${{ secrets.SPARK_USER }}@${{ secrets.SPARK_HOST }}:${{ secrets.SPARK_DEPLOY_PATH }}/deploy.sh"
          ssh -i ~/.ssh/id_deploy -p 10022 "${{ secrets.SPARK_USER }}@${{ secrets.SPARK_HOST }}" \
            "chmod +x ${{ secrets.SPARK_DEPLOY_PATH }}/deploy.sh"

      - name: Run deploy script on Spark
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -p 10022 "${{ secrets.SPARK_USER }}@${{ secrets.SPARK_HOST }}" \
            "DEPLOY_DIR='${{ secrets.SPARK_DEPLOY_PATH }}' HEALTH_URL='${{ env.HEALTH_URL }}' DEPLOY_SHA='$SHA' ${{ secrets.SPARK_DEPLOY_PATH }}/deploy.sh"

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_deploy -p 10022 "${{ secrets.SPARK_USER }}@${{ secrets.SPARK_HOST }}" \
            "curl -fsS '${{ env.HEALTH_URL }}'"
