# 격리 DB 테스트 전용 폐기형 PostgreSQL(+pgvector). 기존 docker-compose.yml(rag-postgres/rag_db/postgres_data)과 무관하다.
# - container_name을 고정하지 않으므로 반드시 고유 Compose project(-p)로 실행한다.
#   migration 테스트와 통합 테스트는 서로 다른 project·DB 이름으로 순차 실행한다(같은 포트 55432 사용).
# - bind/named volume 없음. 데이터 디렉터리는 tmpfs라 컨테이너 종료 시 사라진다.
# - 아래 변수는 기본값이 없으며, 없으면 Compose가 기동을 거부한다. 값은 실행 프로세스 환경에만 둔다.
#   ISOLATED_TEST_DB_NAME     rag_migration_test 또는 rag_integration_test만 가능(IsolatedDatabaseGuard가 그 외 이름·127.0.0.1:55432 외 대상을 거부)
#   ISOLATED_TEST_DB_USER
#   ISOLATED_TEST_DB_PASSWORD
services:
  isolated-test-db:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: ${ISOLATED_TEST_DB_NAME:?ISOLATED_TEST_DB_NAME is required}
      POSTGRES_USER: ${ISOLATED_TEST_DB_USER:?ISOLATED_TEST_DB_USER is required}
      POSTGRES_PASSWORD: ${ISOLATED_TEST_DB_PASSWORD:?ISOLATED_TEST_DB_PASSWORD is required}
      TZ: Asia/Seoul
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"
